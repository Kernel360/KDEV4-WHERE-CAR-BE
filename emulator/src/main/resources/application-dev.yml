spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: none
  datasource:
    url: jdbc:mariadb://${DB_HOST_NAME}/${DB_STORAGE_NAME}?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_AUTH_ID}
    password: ${DB_AUTH_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver