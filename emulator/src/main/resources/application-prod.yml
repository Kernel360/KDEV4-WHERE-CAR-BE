spring:
  config:
    activate:
      on-profile: prod

server:
  port: 8095
  ssl:
    key-alias: tomcat
    key-store: classpath:keystore-deploy.p12
    key-store-type: PKCS12
    key-store-password: ${KEY_STORE_PASSWORD}
    key-store-provider: SunJSSE
    #trust-store: classpath:truststore.jks
    #trust-store-password: ${TRUST_STORE_PASSWORD}
  http2:
    enabled: true
  error:
    include-message: always
    include-stacktrace: never

wherecar:
  device:
    mdn: 01234567890
    vrp: 34가5678
  db:
    storage-file-name: device_db.json
  api:
    rest:
      url: http://localhost:8080
      token:
        endpoint: /emulator/token
    collector:
      url: http://localhost:8090
    hub:
      url: http://localhost:8090 # TODO: 실제로는 허브로 주기및 시동 정보를 보내야 함!
      event:
        start-endpoint: /api/on
        cycle-endpoint: /api/gps
        stop-endpoint: /api/off
