<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${deviceStatus} ? '어디카 에뮬레이터 - ON' : '어디카 에뮬레이터 - OFF'">어디카 에뮬레이터</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563EB' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0'/><circle cx='12' cy='10' r='3'/></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ["class"],
      theme: {
        container: {
          center: true,
          padding: "2rem",
          screens: {
            "2xl": "1400px",
          },
        },
        extend: {
          colors: {
            border: "hsl(var(--border))",
            input: "hsl(var(--input))",
            ring: "hsl(var(--ring))",
            background: "hsl(var(--background))",
            foreground: "hsl(var(--foreground))",
            primary: {
              DEFAULT: "#2563EB",
              foreground: "hsl(var(--primary-foreground))",
            },
            secondary: {
              DEFAULT: "hsl(var(--secondary))",
              foreground: "hsl(var(--secondary-foreground))",
            },
            destructive: {
              DEFAULT: "hsl(var(--destructive))",
              foreground: "hsl(var(--destructive-foreground))",
            },
            muted: {
              DEFAULT: "hsl(var(--muted))",
              foreground: "hsl(var(--muted-foreground))",
            },
            accent: {
              DEFAULT: "hsl(var(--accent))",
              foreground: "hsl(var(--accent-foreground))",
            },
            popover: {
              DEFAULT: "hsl(var(--popover))",
              foreground: "hsl(var(--popover-foreground))",
            },
            card: {
              DEFAULT: "hsl(var(--card))",
              foreground: "hsl(var(--card-foreground))",
            },
          },
          borderRadius: {
            lg: "var(--radius)",
            md: "calc(var(--radius) - 2px)",
            sm: "calc(var(--radius) - 4px)",
          },
        },
      },
    }
  </script>
  <style>
    :root {
      --border: 214.3 31.8% 91.4%;
      --input: 214.3 31.8% 91.4%;
      --ring: 222.2 84% 4.9%;
      --background: 0 0% 100%;
      --foreground: 222.2 84% 4.9%;
      --primary: 217 91% 60%;
      --primary-foreground: 210 40% 98%;
      --secondary: 210 40% 96.1%;
      --secondary-foreground: 222.2 47.4% 11.2%;
      --destructive: 0 84.2% 60.2%;
      --destructive-foreground: 210 40% 98%;
      --muted: 210 40% 96.1%;
      --muted-foreground: 215.4 16.3% 46.9%;
      --accent: 210 40% 96.1%;
      --accent-foreground: 222.2 47.4% 11.2%;
      --popover: 0 0% 100%;
      --popover-foreground: 222.2 84% 4.9%;
      --card: 0 0% 100%;
      --card-foreground: 222.2 84% 4.9%;
      --radius: 0.5rem;
    }

    .dark {
      --border: 217.2 32.6% 17.5%;
      --input: 217.2 32.6% 17.5%;
      --ring: 212.7 26.8% 83.9%;
      --background: 222.2 84% 4.9%;
      --foreground: 210 40% 98%;
      --primary: 187 100% 50%;
      --primary-foreground: 210 40% 98%;
      --secondary: 217.2 32.6% 17.5%;
      --secondary-foreground: 210 40% 98%;
      --destructive: 0 62.8% 30.6%;
      --destructive-foreground: 210 40% 98%;
      --muted: 217.2 32.6% 17.5%;
      --muted-foreground: 215 20.2% 65.1%;
      --accent: 217.2 32.6% 17.5%;
      --accent-foreground: 210 40% 98%;
      --popover: 222.2 84% 4.9%;
      --popover-foreground: 210 40% 98%;
      --card: 222.2 84% 4.9%;
      --card-foreground: 210 40% 98%;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .container {
      flex: 1;
    }
  </style>
</head>
<body class="min-h-screen bg-gray-50 dark:bg-gray-900">
<div class="container mx-auto py-8 px-4">
  <header class="flex items-center justify-between mb-12">
    <div class="flex items-center gap-3">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-map-pin-icon lucide-map-pin text-primary"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
      <h1 class="text-4xl font-bold dark:text-white tracking-tight">WHERECAR</h1>
      <span class="text-4xl font-bold text-primary tracking-tight">어디카</span>
    </div>
    <button id="theme-toggle" class="p-3 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors duration-200">
      <svg class="w-7 h-7 hidden dark:block text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
      </svg>
      <svg class="w-7 h-7 block dark:hidden text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
      </svg>
    </button>
  </header>
  <div class="relative mb-12 overflow-hidden rounded-xl bg-gradient-to-r from-primary/10 to-primary/5 dark:from-primary/20 dark:to-primary/10">
    <div class="relative p-8 text-center">
      <h2 class="text-2xl font-semibold text-primary dark:text-primary-foreground mb-2" th:text="${deviceStatus} ? '에뮬레이터 작동 중' : '에뮬레이터 대기 중'"></h2>
      <p class="text-base text-muted-foreground dark:text-gray-400 mb-8" th:text="${deviceStatus} ? '차량이 현재 이동 중입니다.' : '에뮬레이터를 시작하려면 아래 버튼을 클릭하세요.'"></p>
      
      <div id="car-status-animation" class="relative h-48 flex items-center justify-center" th:if="${deviceStatus}">
        <div class="absolute inset-0 flex items-center justify-center">
          <div class="w-full max-w-4xl h-1 bg-primary/20 rounded-full"></div>
        </div>
        <div class="relative w-full max-w-4xl flex justify-center items-center">
          <svg class="w-32 h-32 text-primary animate-drive" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/>
            <circle cx="7" cy="17" r="2"/>
            <path d="M9 17h6"/>
            <circle cx="17" cy="17" r="2"/>
          </svg>
        </div>
      </div>
    </div>
  </div>
  <div class="rounded-xl border bg-card text-card-foreground shadow-lg mb-8 dark:bg-gray-800 dark:border-gray-700 transition-all duration-300">
    <div class="flex flex-col space-y-2 p-8">
      <div class="flex items-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-route text-primary"><path d="M3 19V5c0-1.1.9-2 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M7 9h10"/><path d="M7 15h10"/></svg>
        <h3 class="text-2xl font-semibold leading-none tracking-tight dark:text-white">여정 정보</h3>
      </div>
      <p class="text-base text-muted-foreground dark:text-gray-400 ml-9">
        현재 차량의 여정 정보를 확인하세요.
      </p>
    </div>
    <div class="p-8">
      <div class="relative flex items-center gap-3 bg-white dark:bg-gray-700 rounded-lg border border-input p-4 shadow-sm">
        <div class="flex-1 flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-map-pin text-primary"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
          <div class="flex-1">
            <div class="text-sm text-gray-500 dark:text-gray-400">출발지</div>
            <div class="text-base font-medium dark:text-white" th:text="${departure != null ? departure : '출발지 정보 없음'}">출발지</div>
          </div>
        </div>
        <div class="flex items-center justify-center w-8 h-8 rounded-full bg-primary/10 text-primary">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-right"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </div>
        <div class="flex-1 flex items-center gap-2 justify-end">
          <div class="flex-1 text-right">
            <div class="text-sm text-gray-500 dark:text-gray-400">도착지</div>
            <div class="text-base font-medium dark:text-white" th:text="${destination != null ? destination : '도착지 정보 없음'}">도착지</div>
          </div>
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-map-pin text-primary"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
        </div>
      </div>
    </div>
  </div>
  <div class="rounded-xl border bg-card text-card-foreground shadow-lg mb-8 dark:bg-gray-800 dark:border-gray-700 transition-all duration-300">
    <div class="flex flex-col space-y-2 p-8">
      <div class="flex items-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings text-primary"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        <h3 class="text-2xl font-semibold leading-none tracking-tight dark:text-white">차량 에뮬레이터 컨트롤</h3>
      </div>
      <p class="text-base text-muted-foreground dark:text-gray-400 ml-9">
        환영합니다, 관리자님 차량 관제 시스템 입니다.
      </p>
    </div>
    <div class="p-8">
      <form th:action="@{/device/toggle}" th:object="${carIdentity}" method="post" class="space-y-6">
        <div class="grid grid-cols-2 gap-4">
          <div class="space-y-3">
            <label for="carIdentity" class="text-base font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70 dark:text-white">차량 번호</label>
            <div class="flex items-center gap-3">
              <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-car text-primary"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
              <input id="carIdentity" name="carIdentity" class="flex h-12 w-full rounded-lg border border-input bg-background px-4 py-2 text-base ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 dark:bg-gray-700 dark:border-gray-600 dark:text-white" th:value="${carIdentity.mdn}" readonly/>
            </div>
          </div>
          <div class="space-y-3">
            <label for="deviceId" class="text-base font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70 dark:text-white">식별키</label>
            <div class="flex items-center gap-3">
              <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-key text-primary"><path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
              <input id="deviceId" name="deviceId" class="flex h-12 w-full rounded-lg border border-input bg-background px-4 py-2 text-base ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 dark:bg-gray-700 dark:border-gray-600 dark:text-white" th:value="${carIdentity.vrp}" readonly/>
            </div>
          </div>
        </div>

        <div class="relative">
          <button type="submit"
                  th:classappend="${deviceStatus} ? 'bg-red-500 text-white hover:bg-red-600' : 'bg-primary text-primary-foreground hover:bg-primary/90'"
                  class="relative inline-flex items-center justify-center rounded-lg text-base font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 h-12 px-6 py-2 w-full shadow-md hover:shadow-lg transition-all duration-200"
                  th:text="${deviceStatus} ? '에뮬레이터 중지' : '에뮬레이터 작동'">
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
<footer class="bg-gray-200 dark:bg-gray-800 text-center py-6 mt-8 w-full">
  <p class="text-sm text-gray-600 dark:text-gray-400">&copy; 2025 WHERECAR. All rights reserved.</p>
</footer>

<style>
  @keyframes drive {
    0% {
      transform: translateX(-100%) rotate(0deg) scale(0.8);
      opacity: 0;
      filter: blur(4px);
    }
    10% {
      opacity: 1;
      filter: blur(0);
      transform: translateX(-50%) rotate(0deg) scale(1);
    }
    45% {
      transform: translateX(0%) rotate(0deg) scale(1.2);
    }
    55% {
      transform: translateX(0%) rotate(0deg) scale(1.2);
    }
    90% {
      opacity: 1;
      filter: blur(0);
      transform: translateX(50%) rotate(0deg) scale(1);
    }
    100% {
      transform: translateX(100%) rotate(0deg) scale(0.8);
      opacity: 0;
      filter: blur(4px);
    }
  }

  .animate-drive {
    animation: drive 4s ease-in-out infinite;
    position: relative;
  }

  @keyframes trackGlow {
    0% {
      background: linear-gradient(90deg, transparent, hsl(var(--primary) / 0.2), transparent);
      transform: translateX(-100%);
    }
    100% {
      background: linear-gradient(90deg, transparent, hsl(var(--primary) / 0.2), transparent);
      transform: translateX(100%);
    }
  }

  .animate-track-glow {
    animation: trackGlow 2s linear infinite;
  }

  #car-status-animation::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, hsl(var(--primary) / 0.3), transparent);
    transform: translateY(-50%);
    animation: trackGlow 2s linear infinite;
  }
</style>

<script>
  const themeToggle = document.getElementById('theme-toggle');
  const html = document.documentElement;

  // Check for saved theme preference
  if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    html.classList.add('dark');
  } else {
    html.classList.remove('dark');
  }

  themeToggle.addEventListener('click', () => {
    html.classList.toggle('dark');
    localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
  });
</script>
</body>
</html>
