<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${deviceStatus} ? '어디카 에뮬레이터 - ON' : '어디카 에뮬레이터 - OFF'">어디카 에뮬레이터</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563EB' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0'/><circle cx='12' cy='10' r='3'/></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ["class"],
      theme: {
        container: {
          center: true,
          padding: {
            DEFAULT: "1rem",
            sm: "1.5rem",
            lg: "2rem",
            xl: "2.5rem",
            "2xl": "3rem"
          },
          screens: {
            sm: "640px",
            md: "768px",
            lg: "1024px",
            xl: "1280px",
            "2xl": "1400px",
          },
        },
        extend: {
          colors: {
            border: "hsl(var(--border))",
            input: "hsl(var(--input))",
            ring: "hsl(var(--ring))",
            background: "hsl(var(--background))",
            foreground: "hsl(var(--foreground))",
            primary: {
              DEFAULT: "#2563EB",
              foreground: "hsl(var(--primary-foreground))",
            },
            secondary: {
              DEFAULT: "hsl(var(--secondary))",
              foreground: "hsl(var(--secondary-foreground))",
            },
            destructive: {
              DEFAULT: "hsl(var(--destructive))",
              foreground: "hsl(var(--destructive-foreground))",
            },
            muted: {
              DEFAULT: "hsl(var(--muted))",
              foreground: "hsl(var(--muted-foreground))",
            },
            accent: {
              DEFAULT: "hsl(var(--accent))",
              foreground: "hsl(var(--accent-foreground))",
            },
            popover: {
              DEFAULT: "hsl(var(--popover))",
              foreground: "hsl(var(--popover-foreground))",
            },
            card: {
              DEFAULT: "hsl(var(--card))",
              foreground: "hsl(var(--card-foreground))",
            },
          },
          borderRadius: {
            lg: "var(--radius)",
            md: "calc(var(--radius) - 2px)",
            sm: "calc(var(--radius) - 4px)",
          },
        },
      },
    }
  </script>
  <style>
    :root {
      --border: 214.3 31.8% 91.4%;
      --input: 214.3 31.8% 91.4%;
      --ring: 222.2 84% 4.9%;
      --background: 0 0% 100%;
      --foreground: 222.2 84% 4.9%;
      --primary: 217 91% 60%;
      --primary-foreground: 210 40% 98%;
      --secondary: 210 40% 96.1%;
      --secondary-foreground: 222.2 47.4% 11.2%;
      --destructive: 0 84.2% 60.2%;
      --destructive-foreground: 210 40% 98%;
      --muted: 210 40% 96.1%;
      --muted-foreground: 215.4 16.3% 46.9%;
      --accent: 210 40% 96.1%;
      --accent-foreground: 222.2 47.4% 11.2%;
      --popover: 0 0% 100%;
      --popover-foreground: 222.2 84% 4.9%;
      --card: 0 0% 100%;
      --card-foreground: 222.2 84% 4.9%;
      --radius: 0.5rem;
    }

    .dark {
      --border: 217.2 32.6% 17.5%;
      --input: 217.2 32.6% 17.5%;
      --ring: 212.7 26.8% 83.9%;
      --background: 222.2 84% 4.9%;
      --foreground: 210 40% 98%;
      --primary: 187 100% 50%;
      --primary-foreground: 210 40% 98%;
      --secondary: 217.2 32.6% 17.5%;
      --secondary-foreground: 210 40% 98%;
      --destructive: 0 62.8% 30.6%;
      --destructive-foreground: 210 40% 98%;
      --muted: 217.2 32.6% 17.5%;
      --muted-foreground: 215 20.2% 65.1%;
      --accent: 217.2 32.6% 17.5%;
      --accent-foreground: 210 40% 98%;
      --popover: 222.2 84% 4.9%;
      --popover-foreground: 210 40% 98%;
      --card: 222.2 84% 4.9%;
      --card-foreground: 210 40% 98%;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .container {
      flex: 1;
    }

    @keyframes drive {
      0% {
        transform: translateX(-100%) rotate(0deg) scale(0.8);
        opacity: 0;
        filter: blur(4px);
      }
      10% {
        opacity: 1;
        filter: blur(0);
        transform: translateX(-50%) rotate(0deg) scale(1);
      }
      45% {
        transform: translateX(0%) rotate(0deg) scale(1.2);
      }
      55% {
        transform: translateX(0%) rotate(0deg) scale(1.2);
      }
      90% {
        opacity: 1;
        filter: blur(0);
        transform: translateX(50%) rotate(0deg) scale(1);
      }
      100% {
        transform: translateX(100%) rotate(0deg) scale(0.8);
        opacity: 0;
        filter: blur(4px);
      }
    }

    .animate-drive {
      animation: drive 4s ease-in-out infinite;
      position: relative;
    }

    @keyframes trackGlow {
      0% {
        background: linear-gradient(90deg, transparent, hsl(var(--primary) / 0.2), transparent);
        transform: translateX(-100%);
      }
      100% {
        background: linear-gradient(90deg, transparent, hsl(var(--primary) / 0.2), transparent);
        transform: translateX(100%);
      }
    }

    .animate-track-glow {
      animation: trackGlow 2s linear infinite;
    }

    #car-status-animation::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, hsl(var(--primary) / 0.3), transparent);
      transform: translateY(-50%);
      animation: trackGlow 2s linear infinite;
    }

    /* 커스텀 모달 스타일 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background-color: white;
      padding: 2rem;
      border-radius: 0.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      max-width: 400px;
      width: 90%;
    }

    .dark .modal-content {
      background-color: #1f2937;
      color: white;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .modal-button {
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .modal-button-confirm {
      background-color: #2563eb;
      color: white;
    }

    .modal-button-confirm:hover {
      background-color: #1d4ed8;
    }

    .modal-button-cancel {
      background-color: #f3f4f6;
      color: #374151;
    }

    .dark .modal-button-cancel {
      background-color: #374151;
      color: #f3f4f6;
    }

    .modal-button-cancel:hover {
      background-color: #e5e7eb;
    }

    .dark .modal-button-cancel:hover {
      background-color: #4b5563;
    }
  </style>
</head>
<body class="min-h-screen bg-gray-50 dark:bg-gray-900">
<div class="container mx-auto py-8 px-4">
  <header class="flex items-center justify-between mb-12">
    <div class="flex items-center gap-3">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-map-pin-icon lucide-map-pin text-primary"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
      <h1 class="text-4xl font-bold dark:text-white tracking-tight">WHERECAR</h1>
      <span class="text-4xl font-bold text-primary tracking-tight">어디카</span>
    </div>
    <div class="flex items-center gap-3">
      <!-- 모드 전환 버튼 -->
      <div class="relative">
        <button id="mode-toggle" class="p-3 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors duration-200">
          <svg id="simulation-mode-icon" class="w-7 h-7 block text-gray-800 dark:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/>
            <circle cx="7" cy="17" r="2"/>
            <path d="M9 17h6"/>
            <circle cx="17" cy="17" r="2"/>
          </svg>
          <svg id="realtime-mode-icon" class="w-7 h-7 hidden text-gray-800 dark:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2v2"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 20v2"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.93 4.93l1.41 1.41"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.66 17.66l1.41 1.41"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2 12h2"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12h2"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6.34 17.66l-1.41 1.41"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.07 4.93l-1.41 1.41"></path>
          </svg>
        </button>
      </div>
      <!-- 테마 전환 버튼 -->
      <button id="theme-toggle" class="p-3 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors duration-200">
        <svg class="w-7 h-7 hidden dark:block text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
        </svg>
        <svg class="w-7 h-7 block dark:hidden text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
        </svg>
      </button>
    </div>
  </header>
  <div class="relative mb-12 overflow-hidden rounded-xl bg-gradient-to-r from-primary/10 to-primary/5 dark:from-primary/20 dark:to-primary/10">
    <div class="relative p-8 text-center">
      <div class="flex items-center justify-center mb-2 gap-3">
        <h2 class="text-2xl font-semibold text-primary dark:text-primary-foreground" th:text="${deviceStatus} ? '에뮬레이터 작동 중' : '에뮬레이터 대기 중'"></h2>
        <div class="flex items-center gap-2">
          <span id="mode-badge" class="px-3 py-1 text-sm font-semibold bg-blue-100 text-blue-800 dark:bg-blue-800 dark:text-blue-100 rounded-full border border-blue-200 dark:border-blue-700 shadow-sm">시뮬레이션 모드</span>
        </div>
      </div>
      <p class="text-base text-muted-foreground dark:text-gray-400 mb-8" th:text="${deviceStatus} ? '차량이 현재 이동 중입니다.' : '에뮬레이터를 시작하려면 아래 버튼을 클릭하세요.'"></p>
      
      <div id="car-status-animation" class="relative h-48 flex items-center justify-center" th:if="${deviceStatus}">
        <div class="absolute inset-0 flex items-center justify-center">
          <div class="w-full max-w-4xl h-1 bg-primary/20 rounded-full"></div>
        </div>
        <div class="relative w-full max-w-4xl flex justify-center items-center">
          <svg class="w-32 h-32 text-primary animate-drive" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/>
            <circle cx="7" cy="17" r="2"/>
            <path d="M9 17h6"/>
            <circle cx="17" cy="17" r="2"/>
          </svg>
        </div>
      </div>
    </div>
  </div>
  <div class="rounded-xl border bg-card text-card-foreground shadow-lg mb-8 dark:bg-gray-800 dark:border-gray-700 transition-all duration-300">
    <div class="flex flex-col space-y-2 p-8">
      <div class="flex items-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-route text-primary"><path d="M3 19V5c0-1.1.9-2 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M7 9h10"/><path d="M7 15h10"/></svg>
        <h3 class="text-2xl font-semibold leading-none tracking-tight dark:text-white">경로 정보</h3>
      </div>
      <p class="text-base text-muted-foreground dark:text-gray-400 ml-9">
        현재 차량의 경로 정보를 확인하세요.
      </p>
    </div>
    <div class="p-8">
      <div class="bg-white dark:bg-gray-700 rounded-lg border border-input p-4 shadow-sm">
        <div class="flex items-center justify-between gap-4">
          <div class="flex items-center gap-4">
            <div class="flex-shrink-0 flex items-center justify-center w-10 h-10 rounded-full bg-primary/10 text-primary">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plane-takeoff"><path d="M2 22h20"/><path d="M6.36 17.4 4 17l-2-4 1.1-.55a2 2 0 0 1 1.8 0l17 8.5a2 2 0 0 0 1.8 0L22 18l-4-6-5.5 1.5"/><path d="M18.4 3.6a2 2 0 0 1 2.8 2.8L15 10l-4-2-1.4 3.6L6 13l-2-2 2-4 3 1.4Z"/></svg>
            </div>
            <div class="flex-1 min-w-0">
              <div class="text-sm text-gray-500 dark:text-gray-400">출발지</div>
              <div class="text-lg font-medium dark:text-white truncate" th:text="${departure != null ? departure : '출발지 정보 없음'}">출발지</div>
            </div>
          </div>
          <div class="flex items-center justify-center">
            <div class="flex items-center justify-center w-10 h-10 rounded-full bg-primary/10 text-primary">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-right"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </div>
          </div>
          <div class="flex items-center gap-4">
            <div class="flex-shrink-0 flex items-center justify-center w-10 h-10 rounded-full bg-primary/10 text-primary">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plane-landing"><path d="M2 22h20"/><path d="M3.77 10.77 2 9l2-4.5 1.1.55c.55.28.89.84.98 1.45C6.27 7.12 6.72 7.58 7 8l5 3-5 3c-.28.42-.73.88-1.92 1.95-.5.5-1.2.58-1.79.24L3.77 10.77Z"/><path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2Z"/><path d="M13.5 7.5 19 10l-5.5 2.5L8 12l5.5-4.5Z"/></svg>
            </div>
            <div class="flex-1 min-w-0">
              <div class="text-sm text-gray-500 dark:text-gray-400">도착지</div>
              <div class="text-lg font-medium dark:text-white truncate" th:text="${destination != null ? destination : '도착지 정보 없음'}">도착지</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="rounded-xl border bg-card text-card-foreground shadow-lg mb-8 dark:bg-gray-800 dark:border-gray-700 transition-all duration-300">
    <div class="flex flex-col space-y-2 p-8">
      <div class="flex items-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings text-primary"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        <h3 class="text-2xl font-semibold leading-none tracking-tight dark:text-white">차량 에뮬레이터 컨트롤</h3>
      </div>
      <p class="text-base text-muted-foreground dark:text-gray-400 ml-9">
        환영합니다, 관리자님 차량 관제 시스템 입니다.
      </p>
    </div>
    <div class="p-8">
      <form th:action="@{/device/toggle}" th:object="${carIdentity}" method="post" class="space-y-6">
        <div class="grid grid-cols-2 gap-4">
          <div class="space-y-3">
            <label for="carIdentity" class="text-base font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70 dark:text-white">차량 번호</label>
            <div class="flex items-center gap-3">
              <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-car text-primary"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
              <input id="carIdentity" name="carIdentity" class="flex h-12 w-full rounded-lg border border-input bg-background px-4 py-2 text-base ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 dark:bg-gray-700 dark:border-gray-600 dark:text-white" th:value="${carIdentity.mdn}" readonly/>
            </div>
          </div>
          <div class="space-y-3">
            <label for="deviceId" class="text-base font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70 dark:text-white">식별키</label>
            <div class="flex items-center gap-3">
              <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-key text-primary"><path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
              <input id="deviceId" name="deviceId" class="flex h-12 w-full rounded-lg border border-input bg-background px-4 py-2 text-base ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 dark:bg-gray-700 dark:border-gray-600 dark:text-white" th:value="${carIdentity.vrp}" readonly/>
            </div>
          </div>
        </div>

        <div class="relative">
          <button type="submit"
                  th:classappend="${deviceStatus} ? 'bg-red-500 text-white hover:bg-red-600' : 'bg-primary text-primary-foreground hover:bg-primary/90'"
                  class="relative inline-flex items-center justify-center rounded-lg text-base font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 h-12 px-6 py-2 w-full shadow-md hover:shadow-lg transition-all duration-200"
                  th:text="${deviceStatus} ? '에뮬레이터 중지' : '에뮬레이터 작동'">
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
<footer class="bg-gray-200 dark:bg-gray-800 text-center py-6 mt-8 w-full">
  <p class="text-sm text-gray-600 dark:text-gray-400">&copy; 2025 WHERECAR. All rights reserved.</p>
</footer>

<script>
  const themeToggle = document.getElementById('theme-toggle');
  const modeToggle = document.getElementById('mode-toggle');
  const simulationModeIcon = document.getElementById('simulation-mode-icon');
  const realtimeModeIcon = document.getElementById('realtime-mode-icon');
  const modeBadge = document.getElementById('mode-badge');
  const html = document.documentElement;
  const deviceStatus = [[${deviceStatus}]];
  let watchId = null;

  // GPS 기반 위치 정보 수집 함수
  function startRealtimeLocationTracking() {
    if (!navigator.geolocation) {
      console.error('Geolocation이 지원되지 않는 브라우저입니다.');
      return;
    }

    const options = {
      enableHighAccuracy: true,
      timeout: 5000,
      maximumAge: 0
    };

    // 위치 정보를 주기적으로 가져오는 함수
    function updateLocation() {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const { latitude, longitude } = position.coords;
          const timestamp = new Date().toISOString();
          
          // Nominatim API로 위치 정보 검증
          fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=18`)
            .then(response => response.json())
            .then(data => {
              console.log(`[${timestamp}] 위도: ${latitude}, 경도: ${longitude}`);
            })
            .catch(error => {
              console.log(`[${timestamp}] 위도: ${latitude}, 경도: ${longitude}`);
            });
        },
        (error) => {
          const timestamp = new Date().toISOString();
          switch(error.code) {
            case error.PERMISSION_DENIED:
              console.error(`[${timestamp}] 위치 권한이 거부되었습니다.`);
              break;
            case error.POSITION_UNAVAILABLE:
              console.error(`[${timestamp}] 위치 정보를 사용할 수 없습니다.`);
              break;
            case error.TIMEOUT:
              console.error(`[${timestamp}] 위치 정보를 가져오는데 시간이 너무 오래 걸립니다.`);
              break;
            default:
              console.error(`[${timestamp}] 위치 정보를 가져오는데 실패했습니다: ${error.message}`);
          }
        },
        options
      );
    }

    // 초기 위치 정보 가져오기
    updateLocation();

    // 1초마다 위치 정보 업데이트
    const intervalId = setInterval(updateLocation, 1000);

    // 에뮬레이터 중지 시 인터벌 정리 함수 반환
    return () => clearInterval(intervalId);
  }

  // 에뮬레이터 시작/중지 버튼 클릭 이벤트
  const toggleButton = document.querySelector('button[type="submit"]');
  let locationInterval = null;

  toggleButton.addEventListener('click', () => {
    const currentMode = localStorage.getItem('mode') || 'simulation';
    
    if (deviceStatus) {
      // 에뮬레이터 중지
      if (locationInterval) {
        locationInterval();
        locationInterval = null;
      }
      console.log('위치 추적이 중지되었습니다.');
      updateModeToggleState(false);
    } else {
      // 에뮬레이터 시작
      if (currentMode === 'realtime') {
        console.log('실시간 모드에서 위치 추적을 시작합니다.');
        locationInterval = startRealtimeLocationTracking();
      } else {
        console.log('시뮬레이션 모드입니다. 위치 추적을 시작하지 않습니다.');
      }
      updateModeToggleState(true);
    }
  });

  // 페이지 로드 시 현재 모드와 에뮬레이터 상태 확인
  document.addEventListener('DOMContentLoaded', () => {
    const currentMode = localStorage.getItem('mode') || 'simulation';
    if (deviceStatus && currentMode === 'realtime') {
      console.log('페이지 로드: 실시간 모드에서 위치 추적을 시작합니다.');
      locationInterval = startRealtimeLocationTracking();
    }
  });

  // Check for saved theme preference
  if (localStorage.getItem('theme') === 'dark') {
    html.classList.add('dark');
  } else {
    html.classList.remove('dark');
    localStorage.setItem('theme', 'light');
  }

  // Check for saved mode preference
  let currentMode = localStorage.getItem('mode');
  
  // 처음 접속한 클라이언트인 경우 시뮬레이션 모드로 설정
  if (!currentMode) {
    currentMode = 'simulation';
    localStorage.setItem('mode', currentMode);
  }
  
  // 현재 모드로 UI 업데이트
  updateModeUI(currentMode);

  // 커스텀 모달 생성 함수
  function createModal(message, onConfirm) {
    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.innerHTML = `
      <div class="modal-content">
        <div class="text-lg font-semibold mb-4">${message}</div>
        <div class="modal-buttons">
          <button class="modal-button modal-button-cancel">취소</button>
          <button class="modal-button modal-button-confirm">확인</button>
        </div>
      </div>
    `;

    const confirmButton = modal.querySelector('.modal-button-confirm');
    const cancelButton = modal.querySelector('.modal-button-cancel');

    confirmButton.addEventListener('click', () => {
      document.body.removeChild(modal);
      onConfirm(true);
    });

    cancelButton.addEventListener('click', () => {
      document.body.removeChild(modal);
      onConfirm(false);
    });

    document.body.appendChild(modal);
  }

  // 에뮬레이터 상태에 따라 모드 토글 버튼 비활성화
  function updateModeToggleState(isDisabled) {
    if (isDisabled) {
      modeToggle.disabled = true;
      modeToggle.classList.add('opacity-30', 'cursor-not-allowed', 'pointer-events-none');
      modeToggle.setAttribute('aria-disabled', 'true');
      modeToggle.setAttribute('title', '에뮬레이터가 작동 중일 때는 모드를 변경할 수 없습니다');
    } else {
      modeToggle.disabled = false;
      modeToggle.classList.remove('opacity-30', 'cursor-not-allowed', 'pointer-events-none');
      modeToggle.removeAttribute('aria-disabled');
      modeToggle.removeAttribute('title');
    }
  }

  // 모드 토글 핸들러 함수
  function handleModeToggle() {
    if (deviceStatus) {
      return;
    }

    const newMode = simulationModeIcon.classList.contains('block') ? 'realtime' : 'simulation';
    const message = newMode === 'realtime' 
      ? '실시간 모드로 전환하시겠습니까?'
      : '시뮬레이션 모드로 전환하시겠습니까?';

    createModal(message, (confirmed) => {
      if (confirmed) {
        updateModeUI(newMode);
        localStorage.setItem('mode', newMode);
      }
    });
  }

  // 초기 상태 설정
  updateModeToggleState(deviceStatus);

  // 이벤트 리스너 설정
  themeToggle.addEventListener('click', () => {
    html.classList.toggle('dark');
    localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
  });

  modeToggle.addEventListener('click', handleModeToggle);

  function updateModeUI(mode) {
    if (mode === 'simulation') {
      simulationModeIcon.classList.remove('hidden');
      simulationModeIcon.classList.add('block');
      realtimeModeIcon.classList.remove('block');
      realtimeModeIcon.classList.add('hidden');
      modeBadge.textContent = '시뮬레이션 모드';
      modeBadge.classList.remove('bg-green-100', 'text-green-800', 'dark:bg-green-800', 'dark:text-green-100', 'border-green-200', 'dark:border-green-700');
      modeBadge.classList.add('bg-blue-100', 'text-blue-800', 'dark:bg-blue-800', 'dark:text-blue-100', 'border-blue-200', 'dark:border-blue-700');
    } else {
      simulationModeIcon.classList.remove('block');
      simulationModeIcon.classList.add('hidden');
      realtimeModeIcon.classList.remove('hidden');
      realtimeModeIcon.classList.add('block');
      modeBadge.textContent = '실시간 모드';
      modeBadge.classList.remove('bg-blue-100', 'text-blue-800', 'dark:bg-blue-800', 'dark:text-blue-100', 'border-blue-200', 'dark:border-blue-700');
      modeBadge.classList.add('bg-green-100', 'text-green-800', 'dark:bg-green-800', 'dark:text-green-100', 'border-green-200', 'dark:border-green-700');
    }
  }
</script>
</body>
</html>
