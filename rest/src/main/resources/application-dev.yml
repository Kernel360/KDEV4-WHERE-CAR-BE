spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    main-db:
      jdbc-url: jdbc:mysql://${MAIN_DB_HOST_NAME}/${MAIN_DB_STORAGE_NAME}
      username: ${MAIN_DB_USERNAME}
      password: ${MAIN_DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
    stat-db:
      jdbc-url: jdbc:mysql://${STAT_DB_HOST_NAME}/${STAT_DB_STORAGE_NAME}
      username: ${STAT_DB_USERNAME}
      password: ${STAT_DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000
  data:
    redis:
      host: ${REDIS_HOST_NAME}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      port: 6379
  jwt:
    auth-secret: ${JWT_AUTH_SECRET_KEY}
    token-secret: ${JWT_TOKEN_SECRET_KEY}

server:
  port: 8080
