spring:
  application:
    name: rest
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        use_sql_comments: true
        jdbc:
          lob:
            non_contextual_creation: true # LOB 생성 시 컨텍스트를 사용하지 않습니다.

  profiles:
    default: dev
management:
  endpoints:
    web:
      exposure:
        include: health