input {
  beats {
    port => 5044
  }
}

filter {
  # 로그 형식이 JSON인 경우 추가
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      skip_on_invalid_json => true
    }
  } else {
    grok {
      match => { "message" => "\[%{TIMESTAMP_ISO8601:timestamp}\]\[%{LOGLEVEL:log_level}\s*\]\[%{DATA:logger}\]\[%{DATA:method}\] %{GREEDYDATA:message_content}" }
    }
  }

  # 날짜 파싱 개선 - 다양한 포맷 지원
  date {
    match => [
      "timestamp",
      "yyyy-MM-dd HH:mm:ss",
      "yyyy-MM-dd HH:mm:ss.SSS",
      "yyyy-MM-dd'T'HH:mm:ss.SSSZ"
    ]
    target => "@timestamp"
    timezone => "Asia/Seoul"  # 추가: 시간대 설정
    locale => "en"            # 추가: 로케일 설정
  }

  # 타임스탬프 디버그 필드 추가
  ruby {
    code => "
      event.set('debug_timestamp', event.get('@timestamp'))
      event.set('event_time', Time.now.utc)
    "
  }

  # app_name 필드 처리 개선
  if [app_name] {
    mutate {
      add_field => { "app" => "%{app_name}" }
    }
  } else if [fields][app_name] {
    mutate {
      add_field => { "app" => "%{[fields][app_name]}" }
      add_field => { "app_name" => "%{[fields][app_name]}" }
    }
  } else {
    mutate {
      add_field => { "app" => "unknown" }
      add_field => { "app_name" => "unknown" }
    }
  }

  if ![log_type] and [fields][log_type] {
    mutate {
      add_field => { "log_type" => "%{[fields][log_type]}" }
    }
  }
  
  # 디버깅용 - 필드 값 확인
  ruby {
    code => "
      event.set('debug_app', event.get('app'))
      event.set('debug_app_name', event.get('app_name'))
    "
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS}"]
    user => "${ELASTICSEARCH_USERNAME}"
    password => "${ELASTICSEARCH_PASSWORD}"
    index => "wherecar-%{app}-%{+YYYY.MM.dd}"
    ssl_certificate_verification => false
    timeout => 60     # 추가: 타임아웃 설정
  }

  # 디버깅용 stdout 출력 추가
  stdout {
    codec => rubydebug { metadata => true }
  }
}
