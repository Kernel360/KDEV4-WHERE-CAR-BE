input {
  beats {
    port => 5044
  }
}

filter {
  # 로그 형식이 JSON인 경우 추가
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      skip_on_invalid_json => true
    }
  } else {
    grok {
      match => { "message" => "\[%{TIMESTAMP_ISO8601:timestamp}\]\[%{LOGLEVEL:log_level}\s*\]\[%{DATA:logger}\]\[%{DATA:method}\] %{GREEDYDATA:message_content}" }
    }
  }

  date {
    match => [ "timestamp", "yyyy-MM-dd HH:mm:ss" ]
    target => "@timestamp"
  }

  mutate {
    add_field => { "app" => "%{[fields][app_name]}" }
  }

  if ![log_type] and [fields][log_type] {
    mutate {
      add_field => { "log_type" => "%{[fields][log_type]}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS}"]
    user => "${ELASTICSEARCH_USERNAME}"
    password => "${ELASTICSEARCH_PASSWORD}"
    index => "wherecar-%{app}-%{+YYYY.MM.dd}"
    ssl_certificate_verification => false
  }
}
