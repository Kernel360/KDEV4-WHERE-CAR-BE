input {
  beats {
    port => 5044
  }

  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # JSON 처리 로직 개선
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      skip_on_invalid_json => true
      target => "parsed_json"
    }
    # 파싱된 JSON 필드들을 루트 레벨로 복사
    if [parsed_json] {
      ruby {
        code => "
          parsed = event.get('parsed_json')
          if parsed.is_a?(Hash)
            parsed.each do |k,v|
              event.set(k, v) unless k == 'message' || k == '@timestamp'
            end
          end
          event.remove('parsed_json')
        "
      }
    }
  } else {
    grok {
      match => { "message" => "\[%{TIMESTAMP_ISO8601:timestamp}\]\[%{LOGLEVEL:log_level}\s*\]\[%{DATA:logger}\]\[%{DATA:method}\] %{GREEDYDATA:message_content}" }
    }
  }

  # 날짜 파싱 개선 - 다양한 포맷 지원
  date {
    match => [
      "timestamp",
      "yyyy-MM-dd HH:mm:ss",
      "yyyy-MM-dd HH:mm:ss.SSS",
      "yyyy-MM-dd'T'HH:mm:ss.SSSZ"
    ]
    target => "@timestamp"
    timezone => "Asia/Seoul"
    locale => "en"
  }

  # 타임스탬프 디버그 필드 추가
  ruby {
    code => "
      event.set('debug_timestamp', event.get('@timestamp'))
      event.set('event_time', Time.now.utc)
    "
  }

  # app 필드 처리 개선 (중복 제거)
  if ![app] {
    if [fields][app_name] {
      mutate {
        add_field => { "app" => "%{[fields][app_name]}" }
      }
    } else if [fields][app] {
      mutate {
        add_field => { "app" => "%{[fields][app]}" }
      }
    } else if [customFields][app] {
      mutate {
        add_field => { "app" => "%{[customFields][app]}" }
      }
    } else {
      mutate {
        add_field => { "app" => "unknown" }
      }
    }
  }

  if ![log_type] and [fields][log_type] {
    mutate {
      add_field => { "log_type" => "%{[fields][log_type]}" }
    }
  }
  
  # 디버깅용 - 필드 값 확인
  ruby {
    code => "
      event.set('debug_app', event.get('app'))
    "
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "${ELASTICSEARCH_USERNAME}"
    password => "${ELASTICSEARCH_PASSWORD}"
    index => "wherecar-%{[app]}-%{+YYYY.MM.dd}"
    ssl_certificate_verification => false
    timeout => 60
  }

  # 디버깅용 stdout 출력 추가
  stdout {
    codec => rubydebug { metadata => true }
  }
}
