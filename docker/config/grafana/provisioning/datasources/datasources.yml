apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000

  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    database: "[wherecar-*-]YYYY.MM.DD"
    url: ${ELASTICSEARCH_HOSTS}
    basicAuth: true
    basicAuthUser: ${ELASTICSEARCH_USERNAME}
    secureJsonData:
      basicAuthPassword: "${ELASTICSEARCH_PASSWORD}"
    jsonData:
      esVersion: "8.0.0"
      timeField: "@timestamp"
      interval: "Daily"
      logMessageField: "message"
      logLevelField: "level"