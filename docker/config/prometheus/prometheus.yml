global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'wherecar-rest'
    metrics_path: '/actuator/prometheus'
    scheme: 'https'
    static_configs:
      - targets: [ '${REST_SERVER_API}' ]
        labels:
          instance: 'rest-api'
          env: 'prod'

  - job_name: 'wherecar-hub'
    metrics_path: '/actuator/prometheus'
    scheme: 'https'
    static_configs:
      - targets: [ '${HUB_SERVER_API}' ]
        labels:
          instance: 'hub-server'

  - job_name: 'wherecar-batch'
    metrics_path: '/actuator/prometheus'
    scheme: 'http'
    static_configs:
      - targets: [ '${BATCH_SERVER_API}' ]
        labels:
          instance: 'batch-server'

  - job_name: 'wherecar-collector'
    metrics_path: '/actuator/prometheus'
    scheme: 'http'
    static_configs:
      - targets: [ '${COLLECTOR_SERVER_API}' ]
        labels:
          instance: 'collector-server'