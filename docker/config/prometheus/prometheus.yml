global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'wherecar-rest'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'host.docker.internal:8080' ]
        labels:
          instance: 'rest-api'

  - job_name: 'wherecar-hub'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'host.docker.internal:8085' ]
        labels:
          instance: 'hub-server'

  - job_name: 'wherecar-batch'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'host.docker.internal:8095' ]
        labels:
          instance: 'batch-server'

  - job_name: 'wherecar-collector'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'host.docker.internal:8090' ]
        labels:
          instance: 'collector-server'