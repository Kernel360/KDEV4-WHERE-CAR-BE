filebeat.inputs:
  # 앱별 로그 수집 설정
  - type: filestream
    id: active-logs
    enabled: true
    paths:
      - /logs/rest/rest-*.log
      - /logs/collector/collector-*.log
      - /logs/hub/hub-*.log
      - /logs/emulator/emulator-*.log
      - /logs/batch/batch-*.log
    exclude_files: ['\.gz$']
    fields_under_root: true
    fields:
      environment: development
    ignore_older: 24h
    scan_frequency: 5s
    close_inactive: 1h
    harvester_buffer_size: 16384
    max_bytes: 10485760
    backoff.init: 1s
    backoff.max: 10s

  - type: filestream
    id: rolled-logs
    enabled: true
    paths:
      - /logs/rest/{yyyy-MM-dd}/rest-*.log
      - /logs/collector/{yyyy-MM-dd}/collector-*.log
      - /logs/hub/{yyyy-MM-dd}/hub-*.log
      - /logs/emulator/{yyyy-MM-dd}/emulator-*.log
      - /logs/batch/{yyyy-MM-dd}/batch-*.log
    exclude_files: ['\.gz$']
    fields_under_root: true
    fields:
      environment: development
    ignore_older: 72h
    scan_frequency: 10s
    close_inactive: 2h
    harvester_buffer_size: 16384
    max_bytes: 10485760

processors:
  - add_fields:
      target: ''
      fields:
        env: dev
        
  # 애플리케이션 이름과 로그 유형 자동 추출
  - dissect:
      tokenizer: "/logs/%{?app_path}/%{?filename}"
      field: "log.file.path"
      target_prefix: ""
      when:
        regexp:
          log.file.path: "^/logs/[^/]+/[^/]+\\.log$"
          
  - dissect:
      tokenizer: "/logs/%{?app_path}/{yyyy-MM-dd}/%{?filename}"
      field: "log.file.path"
      target_prefix: ""
      when:
        regexp:
          log.file.path: "^/logs/[^/]+/[^/]+/[^/]+\\.log$"
          
  - script:
      lang: javascript
      source: >
        function process(event) {
          var path = event.Get("log.file.path");
          var filename = path.split("/").pop();
          
          // 앱 이름 추출 (첫 번째 '-' 앞 부분)
          var appName = filename.split("-")[0];
          event.Put("app_name", appName);
          
          // 로그 타입 추출 (파일명에 error, sql 등이 있으면 해당 타입으로)
          if (filename.indexOf("-error") >= 0) {
            event.Put("log_type", "error");
          } else if (filename.indexOf("-sql") >= 0) {
            event.Put("log_type", "sql");
          } else {
            event.Put("log_type", "info");
          }
          
          // ECS 컨테이너 환경 정보 추가
          var meta = process.env.ECS_CONTAINER_METADATA_URI_V4;
          if (meta) {
            event.Put("ecs_metadata_uri", meta);
          }
          
          return event;
        }

  # 빈 메시지 건너뛰기
  - drop_event:
      when:
        equals:
          message: ""
          
  # 불필요한 필드 제거
  - drop_fields:
      fields: ["app_path", "filename"]
      ignore_missing: true

# 성능 최적화 설정
filebeat.registry.flush: 1s
filebeat.shutdown_timeout: 10s
filebeat.harvester_limit: 300
filebeat.max_procs: 2
filebeat.spool_size: 2048
filebeat.idle_timeout: 5s
queue.mem:
  events: 4096
  flush.min_events: 256
  flush.timeout: 1s

# Logstash로 전송
output.logstash:
  hosts: ["${LOGSTASH_HOST}"]
  loadbalance: true
  worker: 2
  bulk_max_size: 2048
  
# 모니터링 설정
monitoring:
  enabled: true
  elasticsearch:
    hosts: ["${ELASTICSEARCH_HOSTS}"]
    username: "${ELASTICSEARCH_USERNAME}"
    password: "${ELASTICSEARCH_PASSWORD}"

# 로깅 설정
logging.level: debug
logging.to_stderr: true
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat-dev
  keepfiles: 7
  permissions: 0644
