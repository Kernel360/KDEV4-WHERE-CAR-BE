# 인증 설정: 현재는 비활성화되어 있지만, 배포 환경에서는 보안을 위해 활성화 권장
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: info
  http_server_read_timeout: 120s
  http_server_write_timeout: 120s
  grpc_server_max_recv_msg_size: 8388608
  grpc_server_max_send_msg_size: 8388608

limits_config:
  volume_enabled: true
  # 인제스트 속도 제한 (초당 10MB, 버스트 20MB)
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  # 스트림별 속도 제한
  per_stream_rate_limit: 10MB
  per_stream_rate_limit_burst: 20MB
  # 사용자당 최대 스트림 수
  max_global_streams_per_user: 50000
  # 쿼리 제한
  max_query_length: 720h
  max_query_parallelism: 32
  # 카디널리티 제한
  cardinality_limit: 100000
  # 로그 보관 기간 (30일)
  retention_period: 720h

# 공통 설정: 인스턴스 주소, 경로, 스토리지, 복제
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 0.0.0.0
    kvstore:
      store: inmemory

# 스키마 설정: 인덱스, 저장소 유형 등
schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# 쿼리 캐시 설정: 반복 쿼리 성능 향상을 위한 캐싱
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100
        ttl: 24h
  # 쿼리 최적화
  align_queries_with_step: true
  cache_results: true
  max_retries: 5

# 청크 저장소 설정: 청크 캐싱, 조회 기간 등
chunk_store_config:
  chunk_cache_config:
    embedded_cache:
      enabled: true
      max_size_mb: 200
      ttl: 24h

# 인제스터 설정: 청크 관리 및 수명주기
ingester:
  chunk_idle_period: 1h
  chunk_target_size: 1536000
  chunk_retain_period: 30s
  max_chunk_age: 2h
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1

# 컴팩터 설정: 로그 압축 및 보존 정책
compactor:
  working_directory: /loki/compactor
  compaction_interval: 5m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

# 프론트엔드 설정: 응답 압축, 쿼리 로깅 등
frontend:
  compress_responses: true
  log_queries_longer_than: 10s
  max_outstanding_per_tenant: 2048

# 프론트엔드 워커 설정
frontend_worker:
  grpc_client_config:
    max_send_msg_size: 8388608

# 룰러 설정: 알림 규칙 관리
ruler:
  alertmanager_url: http://localhost:9093
  enable_api: true
  storage:
    type: local
    local:
      directory: /loki/rules

# 분석 설정: 익명 사용 통계 비활성화
analytics:
  reporting_enabled: false
