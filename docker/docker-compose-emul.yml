services:
  emulator-a:
    build:
      context: ../
      dockerfile: docker/file/emulator/Dockerfile
    container_name: wherecar-emulator-a
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ../../config/application-prod-a.yml:/app/config/application-prod.yml:rw
      - ../../logs/emulator-a:/app/logs/emulator:rw
    deploy:
      resources:
        limits:
          memory: 450M
          cpus: '0.2'
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CONFIG_LOCATION=file:/app/config/
      - JAVA_OPTS=-Xmx256m -Xms128m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseCompressedOops -XX:+UseStringDeduplication
      - LOGGING_FILE_PATH=/app/logs/emulator
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - wherecar-network
      
