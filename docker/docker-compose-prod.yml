services:
  rest:
    build:
      # dockerfile, volumes 설정은 해당 경로를 기본 경로로 가지고 있음
      context: ../
      dockerfile: ./docker/rest/Dockerfile
    container_name: wherecar-rest-api
    restart: unless-stopped
    ports:
      # 외부포트 : 내부포트
      - "8080:8080"
    volumes:
      - ../../config/rest-application-prod.yml:/app/config/application-prod.yml:rw
      - ../../logs/rest:/app/logs/rest:rw
    deploy:
      resources:
        # 리소스 제한
        limits:
          memory: 768M
          cpus: '0.5'
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CONFIG_LOCATION=file:/app/config/
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseCompressedOops -XX:+UseStringDeduplication
      - LOGGING_FILE_PATH=/app/logs/rest  # 로그 경로 환경변수 설정
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - wherecar-network
  collector:
    build:
      context: ../
      dockerfile: ./docker/collector/Dockerfile
    container_name: wherecar-collector
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ../../config/collector-application-prod.yml:/app/config/application-prod.yml:rw
      - ../../logs/collector:/app/logs/collector:rw
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.5'
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CONFIG_LOCATION=file:/app/config/
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseCompressedOops -XX:+UseStringDeduplication
      - LOGGING_FILE_PATH=/app/logs/collector
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - wherecar-network
  emulator:
    build:
      context: ../
      dockerfile: ./docker/emulator/Dockerfile
    container_name: wherecar-emulator
    restart: unless-stopped
    ports:
      - "8095:8095"
    volumes:
      - ../../config/emulator-application-prod.yml:/app/config/application-prod.yml:rw
      - ../../logs/emulator:/app/logs/emulator:rw
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.3'
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CONFIG_LOCATION=file:/app/config/
      - JAVA_OPTS=-Xmx256m -Xms128m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseCompressedOops -XX:+UseStringDeduplication
      - LOGGING_FILE_PATH=/app/logs/emulator
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - wherecar-network
  hub:
    build:
      context: ../
      dockerfile: ./docker/hub/Dockerfile
    container_name: wherecar-hub
    restart: unless-stopped
    ports:
      - "8085:8085"
    volumes:
      - ../../config/hub-application-prod.yml:/app/config/application-prod.yml:rw
      - ../../logs/hub:/app/logs/hub:rw
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.3'
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CONFIG_LOCATION=file:/app/config/
      - JAVA_OPTS=-Xmx256m -Xms128m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseCompressedOops -XX:+UseStringDeduplication
      - LOGGING_FILE_PATH=/app/logs/hub
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - wherecar-network
  batch:
    build:
      context: ../
      dockerfile: ./docker/batch/Dockerfile
    container_name: wherecar-batch
    restart: unless-stopped
    ports:
      - "8087:8087"
    volumes:
      - ../../config/batch-application-prod.yml:/app/config/application-prod.yml:rw
      - ../../logs/batch:/app/logs/batch:rw
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.3'
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CONFIG_LOCATION=file:/app/config/
      - JAVA_OPTS=-Xmx256m -Xms128m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseCompressedOops -XX:+UseStringDeduplication
      - LOGGING_FILE_PATH=/app/logs/batch
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - wherecar-network

networks:
  wherecar-network:
    driver: bridge