services:
  main-db:
    image: mysql:8.0
    container_name: main-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: wherecar_main
      MYSQL_USER: ${MYSQL_USER_NAME}
      MYSQL_PASSWORD: ${MYSQL_USER_PASSWORD}
    ports:
      - 3308:3306
    networks:
      - wherecar-network
    volumes:
      - main-db-data:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
  stat-db:
    image: mysql:8.0
    container_name: stat-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: wherecar_stat
      MYSQL_USER: ${MYSQL_USER_NAME}
      MYSQL_PASSWORD: ${MYSQL_USER_PASSWORD}
    ports:
      - 3309:3306
    networks:
      - wherecar-network
    volumes:
      - stat-db-data:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
  meta-db:
    image: mysql:8.0
    container_name: meta-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: wherecar_meta
      MYSQL_USER: ${MYSQL_USER_NAME}
      MYSQL_PASSWORD: ${MYSQL_USER_PASSWORD}
    ports:
      - 3307:3306
    networks:
      - wherecar-network
    volumes:
      - meta-db-data:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
  redis-db:
    image: redis:7.2
    container_name: redis-db
    restart: unless-stopped
    command: >
      --requirepass ${REDIS_PASSWORD}
      --user ${REDIS_USER_NAME} on >${REDIS_USER_PASSWORD} ~* +@read +@write
    ports:
      - 6379:6379
    networks:
      - wherecar-network
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  main-db-data:
    driver: local
  stat-db-data:
    driver: local
  meta-db-data:
    driver: local
  redis-data:
    driver: local

networks:
  wherecar-network:
    driver: bridge
