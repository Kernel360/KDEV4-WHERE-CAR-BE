services:
  main-db:
    image: mysql:8.0
    container_name: main-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wherecar_main
      MYSQL_USER: user
      MYSQL_PASSWORD: 1234
    ports:
      - 3308:3306
    networks:
      - wherecar-network
    volumes:
      - main-db-data:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
  stat-db:
    image: mysql:8.0
    container_name: stat-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wherecar_stat
      MYSQL_USER: user
      MYSQL_PASSWORD: 1234
    ports:
      - 3309:3306
    networks:
      - wherecar-network
    volumes:
      - stat-db-data:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
  meta-db:
    image: mysql:8.0
    container_name: meta-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wherecar_meta
      MYSQL_USER: user
      MYSQL_PASSWORD: 1234
    ports:
      - 3307:3306
    networks:
      - wherecar-network
    volumes:
      - meta-db-data:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
  redis-db:
    image: redis:7.2
    container_name: redis-db
    restart: unless-stopped
    ports:
      - 6379:6379
    networks:
      - wherecar-network
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
volumes:
  main-db-data:
    driver: local
  stat-db-data:
    driver: local
  meta-db-data:
    driver: local
  redis-data:
    driver: local

networks:
  wherecar-network:
    driver: bridge
